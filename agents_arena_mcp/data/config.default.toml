# Agents Arena configuration. `agents-arena init` copies this to .agents-arena/config.toml.
# Values here are defaults; anything set in the repo's config.toml overrides them.

default_variants = ["minimal_patch", "test_first", "clean_boundary"]
default_runner = "manual"
max_variants = 6
max_parallel = 4
run_timeout_sec = 1800
check_timeout_sec = 600

# Worktree location. Empty = ~/.cache/agents-arena/worktrees/<repo>-<hash>.
worktree_root = ""
# Shell command run inside each new worktree before agents start (e.g. "uv sync").
setup = ""
# Optional path (relative to the repo) to a custom variant brief template ($task, $strategy, $workspace, ...).
brief_template = ""

# Check commands, run with `sh -c` in each workspace (and once on the base commit as a baseline).
# Example: checks = [{ name = "tests", cmd = "uv run pytest -q" }]
checks = []

# Changing any of these disqualifies a variant.
protected_paths = [".github/workflows/", ".gitlab-ci.yml", ".agents-arena/", ".claude/", ".codex/", ".opencode/", ".agents/"]
# Touching a matching path sends the decision to a human.
secret_patterns = [
  '(^|/)\.env($|\.)',
  '(^|/)secrets?(/|\.[a-z0-9]+$|$)',
  '(^|/)credentials?(/|\.[a-z0-9]+$|$)',
  'private[_-]?key',
  '(^|/)id_(rsa|ed25519)',
]

[strategies]
minimal_patch = "Implement the smallest safe patch. Avoid public API changes. Add only targeted tests needed to prove the change. Do not refactor unrelated code."
test_first = "Write or update regression tests first, confirm they capture the behavior, then implement the minimum code to pass. Preserve behavior outside the target case."
clean_boundary = "Improve the local boundary or adapter shape while preserving behavior. Accept a larger diff only when it reduces coupling. Add regression coverage."
maintainability_refactor = "Favor long-term readability. Extract small helpers if they reduce branching and duplication. Avoid broad rewrites."
explore = "Explore only: read the code, run the tests, and write findings and a plan to ARENA_NOTES.md. Do not change source files."

[judge]
# A key of [judges.*], or "none" to decide deterministically without an LLM.
runner = "none"
model = ""
timeout_sec = 600
max_survivors = 5
# Optional path (relative to the repo) to a custom judge prompt template.
template = ""
# Phase C, opt-in: propose and run a distinguishing test when a pair splits.
distinguish = false
# Phase C, opt-in: max depth for arena_refine rounds.
max_refine_depth = 1
# Phase C, opt-in: a [judges.*] key for a tool-using final round between the top two when still unresolved,
# e.g. "claude-agentic" or "codex-agentic". Empty = off.
agentic_final = ""

# Implementation runners. Placeholders: {prompt} {prompt_file} {workspace} {model} {run_dir}
[runners.codex]
argv = ["codex", "exec", "--cd", "{workspace}", "--sandbox", "workspace-write", "--json", "{model_flag}", "{prompt}"]
model_flag = ["--model", "{model}"]
family = "openai"

[runners.claude]
argv = ["claude", "-p", "{prompt}", "--output-format", "json", "--permission-mode", "acceptEdits", "{model_flag}"]
model_flag = ["--model", "{model}"]
family = "anthropic"

[runners.opencode]
argv = ["opencode", "run", "--standalone", "--auto", "--format", "json", "{model_flag}", "{prompt}"]
model_flag = ["--model", "{model}"]
family = "opencode"

# Judges run in an empty per-match directory, isolated from user config and the repo.
# Extra placeholders: {schema_file} {schema_json} {output_file}
[judges.codex]
argv = ["codex", "exec", "--cd", "{run_dir}", "--skip-git-repo-check", "--ignore-user-config", "--ephemeral", "--sandbox", "read-only", "--output-schema", "{schema_file}", "--output-last-message", "{output_file}", "{model_flag}", "{prompt}"]
model_flag = ["--model", "{model}"]
family = "openai"

[judges.claude]
argv = ["claude", "-p", "{prompt}", "--output-format", "json", "--json-schema", "{schema_json}", "--setting-sources", "", "--tools", "", "--max-budget-usd", "2", "{model_flag}"]
model_flag = ["--model", "{model}"]
family = "anthropic"

[judges.opencode]
argv = ["opencode", "run", "--standalone", "--format", "json", "{model_flag}", "{prompt}"]
model_flag = ["--model", "{model}"]
family = "opencode"

# Agentic final-round judges: read-only access to both checkouts ({workspace_a}, {workspace_b}).
[judges.codex-agentic]
argv = ["codex", "exec", "--cd", "{run_dir}", "--skip-git-repo-check", "--ignore-user-config", "--ephemeral", "--sandbox", "read-only", "--output-schema", "{schema_file}", "--output-last-message", "{output_file}", "{model_flag}", "{prompt}"]
model_flag = ["--model", "{model}"]
family = "openai"

[judges.claude-agentic]
argv = ["claude", "-p", "{prompt}", "--output-format", "json", "--json-schema", "{schema_json}", "--setting-sources", "", "--tools", "Read,Grep,Glob", "--add-dir", "{workspace_a}", "--add-dir", "{workspace_b}", "--max-budget-usd", "5", "{model_flag}"]
model_flag = ["--model", "{model}"]
family = "anthropic"
