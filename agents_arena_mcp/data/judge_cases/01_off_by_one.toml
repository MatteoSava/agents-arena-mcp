task = "Fix `last_n` so it returns the last n items of the list (it currently drops one)."
expected = "b"

[base]
"lib.py" = """
def last_n(items, n):
    return items[len(items) - n + 1:]
"""

[a]
"lib.py" = """
def last_n(items, n):
    return items[len(items) - n + 2:]
"""

[b]
"lib.py" = """
def last_n(items, n):
    if n <= 0:
        return []
    return items[-n:]
"""
