task = "`is_leap(1900)` returns True but 1900 is not a leap year. Fix it."
expected = "a"

[base]
"dates.py" = """
def is_leap(year):
    return year % 4 == 0
"""

[a]
"dates.py" = """
def is_leap(year):
    return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
"""

[b]
"dates.py" = """
def is_leap(year):
    # Leap years are divisible by 4.
    return year % 4 == 0
"""
