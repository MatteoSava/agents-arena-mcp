[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agents-arena-mcp"
dynamic = ["version"]
description = "MCP server and CLI that runs competing coding-agent variants in isolated git worktrees, gates them on evidence, and judges them blind."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matteo Sava" }]
dependencies = [
  "fastmcp==3.3.1",
  "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest==9.0.3",
    "ruff==0.17.2",
]

[project.scripts]
agents-arena = "agents_arena_mcp.cli:main"
agents-arena-mcp = "agents_arena_mcp.server:main"

[tool.hatch.version]
path = "agents_arena_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agents_arena_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: runs real agent CLIs; enable with AGENTS_ARENA_IT=1"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["agents_arena_mcp"]
